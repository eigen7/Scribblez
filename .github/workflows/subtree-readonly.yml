name: subtree-readonly

# Reject any pushed/PR'd commit that edits a vendored subtree (subtrees/<dir>/).
# Server-side counterpart to .githooks/pre-commit -- unbypassable, and active for
# every developer regardless of their local git config. Subtrees may change only
# via `git subtree pull` (a merge commit), which this check ignores.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check subtrees are read-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # New branch / unknown base: fall back to the first commit reachable.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 "$head" | tail -1)"
          fi
          python3 py/tools/check_subtree_readonly.py "$base" "$head"
